; PlatformIO Project Configuration
; SP9PDF RemoteQTH 6x2 Antenna Switch
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328
src_dir = src

; ---------------------------------------------------------------------------
; Arduino Nano (ATmega328P) - OLD bootloader (57600 baud upload).
; If your Nano has the NEW bootloader, build the :new env below instead.
; ---------------------------------------------------------------------------
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags =
    -D SERBAUD=9600
lib_deps =
    arduino-libraries/LiquidCrystal @ ^1.0.7
    ; Ethernet build (#define EthModule/OTRSP_TCP in src/main.ino) - W5500, auto-detect chipu.
    ; SQ9FK: oficjalna biblioteka Arduino (byla adafruit/Ethernet2 - przestarzala/nieutrzymywana).
    ; Kosztuje wiecej flash niz Ethernet2 (wielochipowa obsluga W5100/W5200/W5500), stad domyslny
    ; __USE_DHCP__ wylaczony (static IP) - patrz docs/DESIGN.md i komentarze w src/main.ino.
    arduino-libraries/Ethernet @ ^2.0.2
; Wire and SPI ship with the Arduino AVR core (auto-detected, no lib_deps needed).

; Nano with NEW bootloader (115200 baud upload) - same firmware.
[env:nanoatmega328new]
extends = env:nanoatmega328
board = nanoatmega328new
