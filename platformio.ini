; PlatformIO Project Configuration
; SP9PDF RemoteQTH 6x2 Antenna Switch
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328
src_dir = src

; ---------------------------------------------------------------------------
; Arduino Nano (ATmega328P) - OLD bootloader (57600 baud upload).
; If your Nano has the NEW bootloader, build the :new env below instead.
; ---------------------------------------------------------------------------
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags =
    -D SERBAUD=9600
; LiquidCrystal and Wire ship with the Arduino AVR core (no lib_deps needed).
; For the optional Ethernet build (#define EthModule in src/main.ino) add:
; lib_deps =
;     arduino-libraries/Ethernet2

; Nano with NEW bootloader (115200 baud upload) - same firmware.
[env:nanoatmega328new]
extends = env:nanoatmega328
board = nanoatmega328new
